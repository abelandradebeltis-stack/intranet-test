version: '3.8'
services:
  web:
    build: ./app
    restart: unless-stopped
    env_file: ./app/.env
    depends_on:
      - db
      - redis
    networks:
      - intranet-net
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet_pass
      POSTGRES_DB: intranet_db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - intranet-net
  redis:
    image: redis:7
    restart: unless-stopped
    networks:
      - intranet-net
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/var/www/static
    depends_on:
      - web
    networks:
      - intranet-net
volumes:
  db-data:
networks:
  intranet-net:
    driver: bridge

{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{% if client %}Editar Cliente{% else %}Criar Novo Cliente{% endif %}</h2>
    <form method="POST" action="{% if client %}{{ url_for('main.edit_client', client_id=client.id) }}{% else %}{{ url_for('main.create_client') }}{% endif %}">
        <div class="form-group">
            <label for="name">Nome do Cliente</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ client.name if client else '' }}" required>
        </div>
        <div class="form-group">
            <label for="contact_person">Pessoa de Contato</label>
            <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ client.contact_person if client else '' }}">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ client.email if client else '' }}">
        </div>
        <div class="form-group">
            <label for="phone">Telefone</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ client.phone if client else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">{% if client %}Salvar Alterações{% else %}Criar Cliente{% endif %}</button>
        <a href="{{ url_for('main.ti_clientes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Suporte - GLPI{% endblock %}

{% block styles %}
{{ super() }}
<style>
    .glpi-iframe-container {
        position: relative;
        width: 100%;
        height: 80vh; /* Initial height */
        transition: all 0.3s ease-in-out;
    }
    .glpi-iframe-container.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1050; /* Higher than sidebar */
        background: #fff;
    }
    .glpi-iframe-container iframe {
        width: 100%;
        height: 100%;
        border: 0;
    }
</style>
{% endblock %}

{% block page_title %}Suporte - GLPI{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
       <span>Acesso ao Sistema de Chamados - GLPI</span>
       <button id="fullscreen-btn" class="btn btn-sm btn-outline-secondary">
           <i class="fas fa-expand-arrows-alt"></i> Expandir
       </button>
    </div>
    <div id="glpi-container" class="card-body p-0 glpi-iframe-container">
        <iframe src="https://glpi.beltis.com.br/" title="Sistema de Chamados GLPI"></iframe>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const glpiContainer = document.getElementById('glpi-container');
        const topBar = document.querySelector('.top-bar');
        const sidebar = document.getElementById('sidebar');

        fullscreenBtn.addEventListener('click', function() {
            glpiContainer.classList.toggle('fullscreen');
            const isFullscreen = glpiContainer.classList.contains('fullscreen');
            
            if (isFullscreen) {
                this.innerHTML = '<i class="fas fa-compress-arrows-alt"></i> Restaurar';
                if(topBar) topBar.style.display = 'none';
                if(sidebar) sidebar.style.display = 'none';
            } else {
                this.innerHTML = '<i class="fas fa-expand-arrows-alt"></i> Expandir';
                if(topBar) topBar.style.display = '';
                if(sidebar) sidebar.style.display = '';
            }
        });
    });
</script>
{% endblock %}
